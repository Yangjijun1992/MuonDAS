# Muon analysis parameters — all tunable knobs live here.
# Override precedence: CLI > user config file > this default file.

parameter_version: "0.1.0"

# Progress bars (tqdm) in the pipeline
progress: true

# --- data source ---
data_source:
  data_root: "/mnt/data/TPC"
  data_format: "waveform_analysis_records" # or "npy" / "hdf5"
  # data_dir: null                            # optional override of raw_dir

# --- runinfo ---
runinfo:
  # Explicit runtype to scope search; empty '' => auto-discover by probing
  # candidate runtype dirs under data_root (e.g. run6_Xe, run_R8520).
  runtype: ""
  # Optional restricted list of runtype names to probe (auto-discovery).
  runtype_candidates: []
  run_tag: "TPC Run"

# --- timing / matching ---
matching:
  sample_interval_ns: 4
  dynode_shift_ns: 16
  match_window_ns: [0, 40]
  min_diff_ns: 0
  max_diff_ns: 40
  # per-channel delay calibration (ns); empty = no per-channel override
  channel_delay_ns: {}

# --- waveform clustering into peaks ---
clustering:
  window_ns: 100 # record times within this window merge into one peak

# --- pulse boundary finding (peak start/end, negative pulses) ---
# Borrowed from pmt_analysis findpulse_st_ed(). Dynode (positive) waveforms
# are inverted before searching.
pulse_finder:
  baseline_samples: 30 # samples used by the first_mean baseline mode
  baseline_mode: "global_median" # global_median (robust) | first_mean (reference)
  height_threshold: 10.0 # ADC: pulse rejected below this height (dynode median ~60)
  min_recovery_frac: 0.3 # min recovery rise (fraction of pulse height) to accept
  end_baseline_tol: 20.0 # ADC: end must return within this of baseline
  end_consecutive: 3 # samples AFTER the end that must stay within tol (confirm stable return)

# --- filtering ---
filtering:
  signal_positive_polarity: # dynode
    asym_min: 0.7
    height_min: null
    height_max: null
  signal_negative_polarity: # anode
    asym_min: 0.7
    height_min: null
    height_max: null
  min_event_length: 7000
  min_seg_area_pe: 20000
  # peak-level amplitude bounds (None = no cut)
  height_min: null
  height_max: null
  # pulse-shape criteria (peak level; None = no cut)
  width_min: null
  width_max: null
  rise_time_max: null
  # peak-level PE cuts (None = no cut)
  min_area_pe_anode: null
  min_area_pe_dynode: null

# --- features / integration ---
features:
  # Integration window strategy:
  #   - fixed: [integral_start, integral_end)
  #   - peak_finder: reserved, plug-in later (user provides peak-finding algo)
  integral_window_mode: "fixed"
  integral_start: 20
  integral_end: 100
  baseline_samples: 10
  rise_time_low: 0.1 # amplitude fraction (10%)
  rise_time_high: 0.9 # amplitude fraction (90%)

# --- PMT SPE gain database ---
gain_db:
  backend: "pmtdata" # pmtdata (preferred) | sqlite | csv
  run_id: "00179" # used by pmtdata backend
  sqlite_path: "" # used when backend == sqlite
  csv_path: "" # used when backend == csv

# --- output ---
output:
  output_dir: "output"
  save_waveforms: true # save .npy waveform clips
  save_plots: true
  cache_dir: "/mnt/data/tmp/muon_analysis"

# --- plotting ---
plotting:
  backend: "Agg"
  dynode_scale: 230 # anode:dynode 实测比值 ~230, sum 对比同尺度
  # Low-pass cutoff (Hz) applied to the dynode waveform in compare_run plots.
  # None => no dynode low-pass filter (raw dynode, matching notebook default).
  dynode_lp_cutoff_hz: null # 硬件 25MHz 低通已内置 → 算法层取消软件低通 (None=不过滤)
  plot_len: 100
  cutoff_hz: 20e6
  fs: 250e6
  sample_interval_ns: 4
  num_samples: 3

# --- PMT pattern + COG position reconstruction ---
cog:
  # Path to the PMT spatial pattern file (pmt_id -> x,y[,z]).
  # Empty => try runinfo mapping channel["pos"], then the fallback below.
  pattern_path: ""
  pattern_format: "auto" # auto | json | csv | yaml
  charge_source: "anode" # anode | dynode  (charge side fed to the centroid)
  # Use the built-in 7-PMT fallback geometry when no pattern file / runinfo
  # position is available (reference xihu_fast_analysis layout).
  use_fallback: false

# --- muon track reconstruction (dynode time slicing) ---
track:
  slice_us: 1.0 # time-slice width (1 µs per requirement §9)
  fs: 250e6     # sample rate (Hz)
  save_plots: true # save per-candidate 3D track PNGs
